name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一ブランチで新しい push があったら古い実行をキャンセル
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # ローカル（make lint）と同じバージョンに固定して再現性を担保
          version: v2.12.2
