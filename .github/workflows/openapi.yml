name: OpenAPI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一ブランチで新しい push があったら古い実行をキャンセル
concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openapi-gen:
    name: openapi-gen diff check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated OpenAPI code is up to date
        run: make openapi-gen && git diff --exit-code
